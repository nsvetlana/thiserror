[project]
name = "thiserror"
version = "0.1.1"
description = "Define typed Python error variants with pattern matching and customizable messages."
readme = "README.md"
authors = [
  { name = "Svetlana N", email = "nsvetlana.ln@yandex.ru" },
]
requires-python = ">=3.12"
keywords = ["error", "error-handling", "error-enum", "errors", "exceptions", "pattern-matching", "typed-errors", "thiserror"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nsvetlana/thiserror"
Repository = "https://github.com/nsvetlana/thiserror"
Issues = "https://github.com/nsvetlana/thiserror/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "ty>=0.0.54",
  "zuban>=0.9.0",
]

[tool.pytest]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s.%(msecs)03d %(levelname)s %(message)s"
log_level = "NOTSET"

[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = [
  "W"
]
