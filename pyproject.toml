[project]
name = "thiserror"
version = "0.1.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = []

[project.scripts]
thiserror = "thiserror:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "ty>=0.0.54",
  "zuban>=0.9.0",
]

[tool.pytest]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s.%(msecs)03d %(levelname)s %(message)s"
log_level = "NOTSET"

[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = [
  "W"
]
