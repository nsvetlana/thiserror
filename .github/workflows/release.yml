name: Publish release to PyPI

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build wheel
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)" tests/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with "$(ls dist/*.tar.gz)" tests/smoke_test.py

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.7

      - name: Publish package
        run: uv publish
