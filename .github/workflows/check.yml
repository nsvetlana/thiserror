name: Check syntax, types and run tests with coverage report
on:
  push:
    tags-ignore:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
  workflow_call:

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync

      - parallel:
          - name: Run ruff check
            run: uv run ruff check --output-format=github .

          - name: Run ruff format check
            run: uv run ruff format --check --output-format=github .

          - name: Run ty check
            run: uv run ty check --output-format=github .

          - name: Run zuban check
            run: uv run zuban check .

          - name: Run pytest
            run: uv run pytest --cov=. --cov-report=xml --junit-xml=pytest.xml

      - name: Publish unit tests results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        background: true
        with:
          files: |
            pytest.xml

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1
        if: (!cancelled())
        background: true
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
